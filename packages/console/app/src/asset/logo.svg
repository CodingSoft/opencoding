<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- CodingSoft Symbol - light theme -->
  <defs>
    <linearGradient id="symbol-gradient-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A2B8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring (C shape) -->
  <g transform="translate(250, 250)">
    <!-- Outer C ring -->
    <path d="M 0 -180 A 180 180 0 1 1 -127.3 -127.3" 
          stroke="url(#symbol-gradient-light)" 
          stroke-width="40" 
          fill="none" 
          stroke-linecap="round"/>
    <path d="M 0 -180 A 180 180 0 1 1 127.3 -127.3" 
          stroke="url(#symbol-gradient-light)" 
          stroke-width="40" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="60" fill="url(#symbol-gradient-light)"/>
  </g>
</svg>