id = "codingsoft"
name = "CodingSoft"
description = "The open source coding agent."
version = "1.3.9"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/codingsoft"

[agent_servers.codingsoft]
name = "CodingSoft"
icon = "./icons/codingsoft.svg"

[agent_servers.codingsoft.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/codingsoft/releases/download/v1.3.9/codingsoft-darwin-arm64.zip"
cmd = "./codingsoft"
args = ["acp"]

[agent_servers.codingsoft.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/codingsoft/releases/download/v1.3.9/codingsoft-darwin-x64.zip"
cmd = "./codingsoft"
args = ["acp"]

[agent_servers.codingsoft.targets.linux-aarch64]
archive = "https://github.com/anomalyco/codingsoft/releases/download/v1.3.9/codingsoft-linux-arm64.tar.gz"
cmd = "./codingsoft"
args = ["acp"]

[agent_servers.codingsoft.targets.linux-x86_64]
archive = "https://github.com/anomalyco/codingsoft/releases/download/v1.3.9/codingsoft-linux-x64.tar.gz"
cmd = "./codingsoft"
args = ["acp"]

[agent_servers.codingsoft.targets.windows-x86_64]
archive = "https://github.com/anomalyco/codingsoft/releases/download/v1.3.9/codingsoft-windows-x64.zip"
cmd = "./codingsoft.exe"
args = ["acp"]
