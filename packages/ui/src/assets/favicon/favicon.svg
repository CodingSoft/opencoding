<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CodingSoft Symbol - Símbolo cuadrado para favicon/icon -->
  <!-- Símbolo circular con C estilizada -->
  <g transform="translate(250, 250)">
    <!-- Círculo exterior -->
    <circle cx="0" cy="0" r="220" stroke="#00BCD4" stroke-width="24" fill="none"/>
    <!-- Círculo interior -->
    <circle cx="0" cy="0" r="150" stroke="#00BCD4" stroke-width="18" fill="none"/>
    <!-- Centro sólido -->
    <circle cx="0" cy="0" r="40" fill="#00BCD4"/>
    <!-- Línea de apertura de la C -->
    <line x1="0" y1="-220" x2="0" y2="-150" stroke="#FFFFFF" stroke-width="40"/>
  </g>
</svg>
